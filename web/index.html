<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Skill Exchange</title>
  <meta name="description" content="Peer tutoring and skill exchange booking system">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%236B3FE4'/%3E%3C/svg%3E">
  <script>
    // Set the theme before the first paint, so a dark-mode user never sees a bright flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('skx.theme'); } catch (e) { /* storage off */ }
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/browse" aria-label="Skill Exchange home">
        <span>Skill Exchange</span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#/browse" data-tab="browse">Browse</a>
        <a href="#/bookings" data-tab="bookings">My bookings</a>
        <a href="#/teach" data-tab="teach">Teach</a>
        <a href="#/credits" data-tab="credits">Credits</a>
        <a href="#/how" data-tab="how">How it works</a>
      </nav>
      <div class="topbar-end">
        <button class="search-btn" id="search-btn" data-action="palette" aria-label="Search pages, skills and people"></button>
        <button class="icon-btn" id="theme-toggle" data-action="theme" aria-label="Switch colour theme"></button>
        <div id="account" class="account"></div>
      </div>
    </div>
  </header>

  <main id="view" class="container" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Peer Tutoring and Skill Exchange Booking System</span>
      <span>Core Java · JDK HttpServer · No frameworks</span>
    </div>
  </footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <button class="icon-btn modal-close" data-action="close" aria-label="Close"></button>
    <div id="modal-body"></div>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
