<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Exchange</title>
  <meta name="description" content="Peer tutoring and skill exchange booking system">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' fill='%23FFD23F' stroke='%23111' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Skill Exchange home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Skill<b>Exchange</b></span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button class="tab" data-tab="browse">Browse</button>
        <button class="tab" data-tab="bookings">My bookings</button>
        <button class="tab" data-tab="teach">Teach</button>
        <button class="tab" data-tab="credits">Credits</button>
        <button class="tab" data-tab="how">How it works</button>
      </nav>
      <div id="account" class="account"></div>
    </div>
  </header>

  <main id="view" class="container" tabindex="-1"></main>

  <footer class="footer container">
    <span>Peer Tutoring and Skill Exchange Booking System</span>
    <span class="mono">Core Java · JDK HttpServer · No frameworks</span>
  </footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <button class="modal-x" data-action="close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
